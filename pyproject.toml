[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-operations-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.22.3,<0.23", "openai>=3,<4", "mcp>=1.19,<3",
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3",
    "langgraph>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:langgraph.*",
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]
