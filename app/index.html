<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operations Agent</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #101214; color: #e2e5e9; }
    main { max-width: 1100px; min-height: 100dvh; margin: auto; padding: 28px 24px; }
    .layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 24px; }
    aside { border-right: 1px solid #353a40; padding-right: 16px; }
    #sessions button { display: block; width: 100%; text-align: left; margin-top: 8px; overflow-wrap: anywhere; }
    #sessions button[aria-current="true"] { color: #8cd8b1; border-color: #8cd8b1; }
    @media (max-width: 600px) { .layout { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid #353a40; padding-bottom: 12px; } }
    header { padding-bottom: 16px; border-bottom: 1px solid #353a40; }
    h1 { font: inherit; font-weight: bold; margin: 0; }
    .hint { color: #9ba4af; font-size: 13px; margin: 4px 0 0; }
    #history { padding-top: 20px; }
    .message { margin: 0 0 24px; overflow-wrap: anywhere; }
    .message.user { white-space: pre-wrap; }
    .user, label { color: #8cd8b1; }
    .error { color: #ffb1a8; white-space: pre-wrap; }
    .message.assistant :first-child { margin-top: 0; }
    .message.assistant :last-child { margin-bottom: 0; }
    .message.assistant p { margin: .6em 0; }
    .message.assistant ul, .message.assistant ol { margin: .6em 0; padding-left: 1.5em; }
    .message.assistant pre { margin: .8em 0; padding: 12px; background: #1a1d21; border-radius: 4px; overflow-x: auto; }
    .message.assistant code { font: inherit; background: #1a1d21; padding: 2px 5px; border-radius: 3px; }
    .message.assistant pre code { background: transparent; padding: 0; }
    .message.assistant a { color: #8cd8b1; }
    .message.assistant blockquote { margin: .8em 0; padding-left: 1em; border-left: 3px solid #353a40; color: #9ba4af; }
    #chat[hidden] { display: none; }
    form { display: flex; align-items: baseline; gap: 12px; }
    input { min-width: 0; flex: 1; font: inherit; color: inherit; background: transparent;
            border: 0; border-bottom: 1px solid #353a40; padding: 8px 0; border-radius: 0; }
    input:focus { outline: none; border-color: #8cd8b1; }
    input.procedure-input { border-color: #8cd8b1; }
    button { font: inherit; background: transparent; color: #9ba4af; border: 1px solid #353a40;
             border-radius: 4px; padding: 4px 10px; cursor: pointer; }
    button:focus-visible { outline: 2px solid #8cd8b1; }
    button:disabled { cursor: wait; opacity: .5; }
    #status { min-height: 24px; }

    /* /procedure mode: a small, consistent accent — not a redesign of the input. */
    .procedure-chip { display: inline-flex; align-items: center; flex-shrink: 0;
      padding: 3px 8px; border-radius: 4px; background: rgba(140, 216, 177, .15);
      border: 1px solid #8cd8b1; color: #8cd8b1; font-size: 11px; font-weight: bold;
      letter-spacing: .06em; white-space: nowrap; }
    .procedure-chip[hidden] { display: none; }
    .procedure-label { color: #8cd8b1; font-size: 11px; font-weight: bold;
      letter-spacing: .08em; margin-bottom: 4px; }
    .message.procedure-user { white-space: pre-wrap; border-left: 3px solid #8cd8b1;
      background: rgba(140, 216, 177, .07); border-radius: 0 4px 4px 0; padding: 6px 12px; }

    /* Transient procedure progress: a tiny, iOS-typing-indicator-like bubble.
       It never joins chat history — it is removed from the DOM once the
       current operation finishes, success or failure. */
    .procedure-progress { display: inline-flex; align-items: baseline; gap: 2px;
      margin: 0 0 24px; padding: 5px 12px; border-radius: 12px; background: #1a1d21;
      color: #9ba4af; font-size: 14px; }
    .procedure-progress-ellipsis { display: inline-block; min-width: 1.4em; text-align: left; }
  </style>
</head>
<body>
  <main class="layout">
    <aside aria-label="Conversations">
      <h1>Conversations</h1>
      <button id="new-session" type="button">+ New</button>
      <nav id="sessions" aria-label="Conversation selector"></nav>
    </aside>
    <div>
    <header>
      <h1>Operations Agent</h1>
      <p class="hint">Enter to send · Conversation context is retained</p>
    </header>
    <section id="history" role="log" aria-label="Conversation" aria-live="polite"></section>
    <form id="chat">
      <label for="message" aria-label="Your message">&gt;</label>
      <span id="procedure-chip" class="procedure-chip" hidden>PROCEDURE</span>
      <input id="message" name="message" placeholder="Ask about your systems…" autocomplete="off" autofocus>
      <button type="submit">Send</button>
    </form>
    <p id="status" class="hint" role="status"></p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script>
    const form = document.querySelector('#chat');
    const input = document.querySelector('#message');
    const button = form.querySelector('button');
    const history = document.querySelector('#history');
    const status = document.querySelector('#status');
    const procedureChip = document.querySelector('#procedure-chip');

    const sessionList = document.querySelector('#sessions');
    const newButton = document.querySelector('#new-session');
    let selectedSession = null;
    let busy = false;

    // Deterministic /procedure routing mirrors the backend: only the literal
    // "/procedure" prefix (followed by whitespace or the end of input) activates
    // procedure mode. No natural-language inference happens here either.
    const PROCEDURE_PATTERN = /^\/procedure(\s(.*))?$/s;
    // Cosmetic-only delay between sequential procedure stages (e.g. KB found
    // -> parsing) revealed from a single response; no second request is made.
    const PROCEDURE_STAGE_DELAY_MS = 500;
    let procedureMode = false;

    function enterProcedureMode(remainder) {
      procedureMode = true;
      procedureChip.hidden = false;
      input.classList.add('procedure-input');
      input.value = remainder;
    }

    function exitProcedureMode(restoreText) {
      procedureMode = false;
      procedureChip.hidden = true;
      input.classList.remove('procedure-input');
      if (restoreText !== undefined) input.value = restoreText;
    }

    input.addEventListener('input', () => {
      if (procedureMode) return;
      const match = input.value.match(/^\/procedure\s(.*)$/s);
      if (match) enterProcedureMode(match[1]);
    });

    input.addEventListener('keydown', (event) => {
      if (procedureMode && event.key === 'Backspace' && input.value === '') {
        event.preventDefault();
        exitProcedureMode('/procedure');
      }
    });

    async function api(path, options) {
      const response = await fetch(path, options);
      const data = await response.json();
      if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'The request could not be processed.');
      return data;
    }

    function setBusy(value) {
      busy = value;
      form.hidden = value || !selectedSession;
      newButton.disabled = value;
      for (const entry of sessionList.querySelectorAll('button')) entry.disabled = value;
    }

    async function refreshSessions() {
      const sessions = await api('/api/sessions');
      sessionList.replaceChildren();
      for (const session of sessions) {
        const entry = document.createElement('button');
        entry.textContent = session.title;
        entry.setAttribute('aria-current', String(session.session_id === selectedSession));
        entry.disabled = busy;
        entry.addEventListener('click', () => selectSession(session.session_id));
        sessionList.append(entry);
      }
      return sessions;
    }

    async function selectSession(id) {
      if (busy) return;
      setBusy(true);
      try {
        const session = await api(`/api/sessions/${id}`);
        selectedSession = id;
        history.replaceChildren();
        input.value = '';
        for (const message of session.messages) appendMessage(message.content, message.role);
        await refreshSessions();
        status.textContent = '';
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    async function newSession() {
      if (busy) return;
      setBusy(true);
      try {
        const session = await api('/api/sessions', { method: 'POST' });
        selectedSession = session.session_id;
        history.replaceChildren();
        input.value = '';
        await refreshSessions();
        status.textContent = '';
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    newButton.addEventListener('click', newSession);

    async function initialize() {
      setBusy(true);
      try {
        const sessions = await refreshSessions();
        setBusy(false);
        if (sessions.length) await selectSession(sessions[0].session_id);
        else await newSession();
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
        setBusy(false);
      }
    }
    initialize();

    function renderMarkdown(text) {
      const html = marked.parse(text, { gfm: true, breaks: true });
      return DOMPurify.sanitize(html);
    }

    function appendMessage(text, role) {
      const line = document.createElement('div');
      line.className = `message ${role}`;
      if (role === 'assistant') {
        line.innerHTML = renderMarkdown(text);
      } else if (role === 'user') {
        line.textContent = `> ${text}`;
      } else {
        line.textContent = text;
      }
      history.append(line);
      form.scrollIntoView({ block: 'end' });
    }

    // A /procedure request is visibly distinct from a normal chat message:
    // a labeled, accent-bordered line instead of the plain "> text" bubble.
    function appendProcedureMessage(query) {
      const line = document.createElement('div');
      line.className = 'message procedure-user';
      const label = document.createElement('div');
      label.className = 'procedure-label';
      label.textContent = 'PROCEDURE';
      const body = document.createElement('div');
      body.textContent = query;
      line.append(label, body);
      history.append(line);
      form.scrollIntoView({ block: 'end' });
    }

    // Reusable transient progress indicator. Procedure stages call show()/
    // update()/hide() with a short label (e.g. "Searching KB", later
    // "Parsing procedure", "Running step 1", ...). Only one instance is ever
    // visible; it never becomes part of chat history and disappears
    // completely — success or failure — once the current operation ends.
    const ELLIPSIS_FRAMES = ['.', '..', '...'];

    const procedureProgress = (() => {
      let element = null;
      let label = null;
      let timer = null;

      function show(text) {
        hide();
        element = document.createElement('div');
        element.className = 'procedure-progress';
        label = document.createElement('span');
        label.textContent = text;
        const ellipsis = document.createElement('span');
        ellipsis.className = 'procedure-progress-ellipsis';
        ellipsis.setAttribute('aria-hidden', 'true');
        element.append(label, ellipsis);
        history.append(element);
        form.scrollIntoView({ block: 'end' });
        let index = 0;
        ellipsis.textContent = ELLIPSIS_FRAMES[0];
        timer = setInterval(() => {
          index = (index + 1) % ELLIPSIS_FRAMES.length;
          ellipsis.textContent = ELLIPSIS_FRAMES[index];
        }, 400);
      }

      function update(text) {
        if (label) label.textContent = text;
        else show(text);
      }

      function hide() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
        if (element) {
          element.remove();
          element = null;
          label = null;
        }
      }

      return { show, update, hide };
    })();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const rawInput = input.value;
      const message = (procedureMode ? `/procedure ${rawInput}` : rawInput).trim();
      if (!message || busy || !selectedSession) return;
      const sessionId = selectedSession;
      const isProcedure = PROCEDURE_PATTERN.test(message);
      const procedureQuery = isProcedure ? (message.match(PROCEDURE_PATTERN)[2] || '').trim() : '';

      if (isProcedure) appendProcedureMessage(procedureQuery);
      else appendMessage(message, 'user');
      input.value = '';
      exitProcedureMode();
      setBusy(true);
      status.textContent = isProcedure ? '' : 'Working…';

      // An empty "/procedure" needs no MCP call, so no loading state is shown.
      if (isProcedure && procedureQuery) procedureProgress.show('Searching KB');

      try {
        const response = await fetch(`/api/sessions/${sessionId}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(typeof data.detail === 'string' ? data.detail : 'The request could not be processed.');
        }
        procedureProgress.hide();
        if (isProcedure && data.type === 'procedure_status') {
          // A single /procedure request can produce more than one normal
          // chat message in sequence (e.g. "KB found: ..." then the parsed
          // summary). Reveal them one at a time, showing the reusable
          // transient progress bubble for the next stage in between.
          const messages = data.messages && data.messages.length ? data.messages : [data.message];
          for (let index = 0; index < messages.length; index++) {
            if (index > 0) {
              procedureProgress.show('Parsing procedure');
              await new Promise((resolve) => setTimeout(resolve, PROCEDURE_STAGE_DELAY_MS));
              procedureProgress.hide();
            }
            appendMessage(messages[index], 'assistant');
          }
        } else {
          appendMessage(data.response, 'assistant');
        }
        await refreshSessions();
      } catch (error) {
        procedureProgress.hide();
        appendMessage(`Error: ${error.message}`, 'error');
      } finally {
        setBusy(false);
        status.textContent = '';
        input.focus();
      }
    });
  </script>
</body>
</html>
