<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operations Agent</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #101214; color: #e2e5e9; }
    main { max-width: 1800px; min-height: 100dvh; margin: auto; padding: 28px 24px; }
    .layout { display: grid; grid-template-columns: minmax(280px, 300px) minmax(0, 1fr) minmax(300px, 320px); gap: 24px; }
    aside { border-right: 1px solid #353a40; padding-right: 16px; }
    .sidebar-row { display: flex; align-items: center; gap: 5px; margin-top: 8px; min-width: 0; }
    .context-select { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;
      text-align: left; font-size: 13px; line-height: 1.6; padding: 8px 10px; }
    .sidebar-copy { flex: 1; min-width: 0; }
    .sidebar-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
      line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
    .sidebar-state { flex-shrink: 0; display: inline-flex; align-items: center; width: 12px; }
    .unread-indicator { color: #facc15; font-size: 14px; line-height: 1; }
    .processing-loader { width: 12px; height: 12px; border: 2px solid #505962;
      border-top-color: #d5dce5; border-radius: 50%; animation: sidebar-spin .85s linear infinite; }
    @keyframes sidebar-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .processing-loader { animation-duration: 2s; } }
    .delete-context { flex-shrink: 0; width: 24px; height: 28px; padding: 0; border: 0;
      opacity: 0; font-size: 16px; }
    .sidebar-row:hover .delete-context, .sidebar-row:focus-within .delete-context { opacity: 1; }
    .delete-context:hover { color: #ffb1a8; }
    @media (hover: none) { .delete-context { opacity: 1; } }
    #sessions button[aria-current="true"] { color: #8cd8b1; border-color: #8cd8b1; }
    header { padding-bottom: 16px; border-bottom: 1px solid #353a40; }
    h1 { font: inherit; font-weight: bold; margin: 0; }
    .hint { color: #9ba4af; font-size: 13px; margin: 4px 0 0; }
    #history { padding-top: 20px; }
    .message { margin: 0 0 24px; overflow-wrap: anywhere; }
    .message.user { white-space: pre-wrap; }
    .user, label { color: #8cd8b1; }
    .error { color: #ffb1a8; white-space: pre-wrap; }
    .message.assistant :first-child { margin-top: 0; }
    .message.assistant :last-child { margin-bottom: 0; }
    .message.assistant p { margin: .6em 0; }
    .message.assistant ul, .message.assistant ol { margin: .6em 0; padding-left: 1.5em; }
    .message.assistant pre { margin: .8em 0; padding: 12px; background: #1a1d21; border-radius: 4px; overflow-x: auto; }
    .message.assistant code { font: inherit; background: #1a1d21; padding: 2px 5px; border-radius: 3px; }
    .message.assistant pre code { background: transparent; padding: 0; }
    .message.assistant a { color: #8cd8b1; }
    .message.assistant blockquote { margin: .8em 0; padding-left: 1em; border-left: 3px solid #353a40; color: #9ba4af; }
    #chat[hidden] { display: none; }
    form { display: flex; align-items: baseline; gap: 12px; }
    input { min-width: 0; flex: 1; font: inherit; color: inherit; background: transparent;
            border: 0; border-bottom: 1px solid #353a40; padding: 8px 0; border-radius: 0; }
    input:focus { outline: none; border-color: #8cd8b1; }
    input.procedure-input { border-color: #8cd8b1; }
    button { font: inherit; background: transparent; color: #9ba4af; border: 1px solid #353a40;
             border-radius: 4px; padding: 4px 10px; cursor: pointer; }
    button:focus-visible { outline: 2px solid #8cd8b1; }
    button:disabled { cursor: wait; opacity: .5; }
    #status { min-height: 24px; }

    .incidents-panel { border-right: 0; border-left: 1px solid #353a40; padding: 0 0 0 16px; font-size: 13px; }
    .severity-critical { --incident-accent: #ef8f8f; }
    .severity-warning { --incident-accent: #d8af69; }
    .severity-info { --incident-accent: #8caed8; }
    .incident-item { border: 0; border-left: 2px solid var(--incident-accent); }
    .incident-item[aria-current="true"] { background: #23272c; color: var(--incident-accent); }
    .incident-meta, .incident-label { color: var(--incident-accent); font-size: 11px; }
    .message.incident { border-left: 3px solid var(--incident-accent); padding: 8px 12px; background: #171a1e; }
    .incident-title { font-weight: bold; margin: 8px 0; }
    .incident-body { white-space: pre-wrap; }
    @media (max-width: 1200px) { .layout { align-content: start; grid-template-columns: minmax(220px, 260px) minmax(0, 1fr); } .incidents-panel { grid-column: 1 / -1; border-left: 0; border-top: 1px solid #353a40; padding: 12px 0; } }
    @media (max-width: 700px) { main { padding: 20px 16px; } .layout { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid #353a40; padding: 0 0 12px; } }

    /* /procedure mode: a small, consistent accent — not a redesign of the input. */
    .procedure-chip { display: inline-flex; align-items: center; flex-shrink: 0;
      padding: 3px 8px; border-radius: 4px; background: rgba(140, 216, 177, .15);
      border: 1px solid #8cd8b1; color: #8cd8b1; font-size: 11px; font-weight: bold;
      letter-spacing: .06em; white-space: nowrap; }
    .procedure-chip[hidden] { display: none; }
    .procedure-label { color: #8cd8b1; font-size: 11px; font-weight: bold;
      letter-spacing: .08em; margin-bottom: 4px; }
    .message.procedure-user { white-space: pre-wrap; border-left: 3px solid #8cd8b1;
      background: rgba(140, 216, 177, .07); border-radius: 0 4px 4px 0; padding: 6px 12px; }

    /* Transient procedure progress: a tiny, iOS-typing-indicator-like bubble.
       It never joins chat history — it is removed from the DOM once the
       current operation finishes, success or failure. */
    .procedure-progress { display: inline-flex; align-items: baseline; gap: 2px;
      margin: 0 0 24px; padding: 5px 12px; border-radius: 12px; background: #1a1d21;
      color: #9ba4af; font-size: 14px; }
    .procedure-progress-ellipsis { display: inline-block; min-width: 1.4em; text-align: left; }
  </style>
</head>
<body>
  <main class="layout">
    <aside aria-label="Conversations">
      <h1>Conversations</h1>
      <button id="new-session" type="button">+ New</button>
      <nav id="sessions" aria-label="Conversation selector"></nav>
    </aside>
    <div>
    <header>
      <h1>Operations Agent</h1>
      <p class="hint">Enter to send · Conversation context is retained</p>
    </header>
    <section id="history" role="log" aria-label="Conversation" aria-live="polite"></section>
    <form id="chat">
      <label for="message" aria-label="Your message">&gt;</label>
      <span id="procedure-chip" class="procedure-chip" hidden>PROCEDURE</span>
      <input id="message" name="message" placeholder="Ask about your systems…" autocomplete="off" autofocus>
      <button type="submit">Send</button>
    </form>
    <p id="status" class="hint" role="status"></p>
    </div>
    <aside class="incidents-panel" aria-label="Incidents">
      <h1>Incidents</h1>
      <p id="incident-status" class="hint" role="status"></p>
      <nav id="incidents" aria-label="Incident inbox"></nav>
    </aside>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script>
    const form = document.querySelector('#chat');
    const input = document.querySelector('#message');
    const button = form.querySelector('button');
    const history = document.querySelector('#history');
    const status = document.querySelector('#status');
    const procedureChip = document.querySelector('#procedure-chip');

    const sessionList = document.querySelector('#sessions');
    const newButton = document.querySelector('#new-session');
    let activeContext = null;
    const sessionStates = new Map();
    let selectionVersion = 0;
    let loadedRevision = null;
    let loadingContext = false;

    // Deterministic /procedure routing mirrors the backend: only the literal
    // "/procedure" prefix (followed by whitespace or the end of input) activates
    // procedure mode. No natural-language inference happens here either.
    const PROCEDURE_PATTERN = /^\/procedure(\s(.*))?$/s;
    let procedureMode = false;
    // True right after a response asks for more procedure input (state
    // "collecting_inputs"). The *next* plain message belongs to that
    // procedure server-side regardless of this flag (routing is decided by
    // the backend's active-procedure session state) — this is only a UI
    // hint for which transient label/status text to show while waiting.
    let procedureAwaitingInput = false;

    function enterProcedureMode(remainder) {
      procedureMode = true;
      procedureChip.hidden = false;
      input.classList.add('procedure-input');
      input.value = remainder;
    }

    function exitProcedureMode(restoreText) {
      procedureMode = false;
      procedureChip.hidden = true;
      input.classList.remove('procedure-input');
      if (restoreText !== undefined) input.value = restoreText;
    }

    input.addEventListener('input', () => {
      if (procedureMode || activeContext?.type === 'incident') return;
      const match = input.value.match(/^\/procedure\s(.*)$/s);
      if (match) enterProcedureMode(match[1]);
    });

    input.addEventListener('keydown', (event) => {
      if (procedureMode && event.key === 'Backspace' && input.value === '') {
        event.preventDefault();
        exitProcedureMode('/procedure');
      }
    });

    async function api(path, options) {
      const response = await fetch(path, options);
      const data = response.status === 204 ? null : await response.json();
      if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'The request could not be processed.');
      return data;
    }

    function updateComposer() {
      form.hidden = !activeContext;
      button.disabled = loadingContext || !!sessionStates.get(activeContext?.sessionId)?.processing;
      input.disabled = button.disabled;
    }
    // State precedence: processing always wins; selected items suppress unread.
    function indicator(state, selected) {
      const slot = document.createElement('span');
      slot.className = 'sidebar-state';
      if (state?.processing) {
        slot.className += ' processing-loader';
        slot.setAttribute('role', 'img');
        slot.setAttribute('aria-label', 'Processing');
      } else if (state?.unread && !selected) {
        slot.className += ' unread-indicator';
        slot.textContent = '●';
        slot.setAttribute('role', 'img');
        slot.setAttribute('aria-label', 'Unread update');
      }
      return slot;
    }
    function sidebarRow(entry, context, processing) {
      const row = document.createElement('div');
      row.className = 'sidebar-row';
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'delete-context';
      remove.textContent = '×';
      remove.setAttribute('aria-label', context.type === 'incident' ? 'Delete incident' : 'Delete conversation');
      remove.title = processing ? 'Cannot delete while processing' : 'Delete';
      remove.disabled = !!processing;
      remove.addEventListener('click', () => deleteContext(context));
      row.append(entry, remove);
      return row;
    }
    async function deleteContext(context) {
      const kind = context.type === 'incident' ? 'incident' : 'conversation';
      if (!window.confirm(`Delete this ${kind}?`)) return;
      try {
        const path = context.type === 'incident' ? `/api/incidents/${context.id}` : `/api/sessions/${context.sessionId}`;
        await api(path, {method: 'DELETE'});
        sessionStates.delete(context.sessionId);
        const wasSelected = activeContext?.sessionId === context.sessionId;
        if (wasSelected) {
          ++selectionVersion;
          activeContext = null;
          loadedRevision = null;
          loadingContext = false;
          procedureAwaitingInput = false;
          procedureProgress.hide();
          history.replaceChildren();
          input.value = '';
          exitProcedureMode();
          status.textContent = '';
          updateComposer();
        }
        const sessions = await refreshSessions();
        await refreshIncidents();
        // Respect any navigation which occurred during the delete request.
        if (wasSelected && !activeContext && sessions.length) await selectSession(sessions[0].session_id);
      } catch (error) { window.alert(error.message); }
    }
    function rememberState(id, state) {
      sessionStates.set(id, state);
    }

    async function refreshSessions() {
      const sessions = await api('/api/sessions');
      sessionList.replaceChildren();
      for (const session of sessions) {
        const entry = document.createElement('button');
        rememberState(session.session_id, session);
        entry.className = 'context-select';
        entry.title = session.title;
        const title = document.createElement('span');
        title.className = 'sidebar-copy sidebar-title';
        title.textContent = session.title;
        entry.append(title, indicator(session, activeContext?.sessionId === session.session_id));
        entry.dataset.sessionId = session.session_id;
        entry.setAttribute('aria-current', String(activeContext?.type === 'conversation' && session.session_id === activeContext.sessionId));
        entry.addEventListener('click', () => selectSession(session.session_id));
        sessionList.append(sidebarRow(entry, {type: 'conversation', id: session.session_id, sessionId: session.session_id}, session.processing));
      }
      return sessions;
    }

    function updateSelection() {
      for (const entry of sessionList.querySelectorAll('.context-select')) {
        const selected = activeContext?.type === 'conversation' && entry.dataset.sessionId === activeContext.sessionId;
        entry.setAttribute('aria-current', String(selected));
        entry.lastElementChild.replaceWith(indicator(sessionStates.get(entry.dataset.sessionId), selected));
      }
      for (const entry of incidentList.querySelectorAll('.context-select')) {
        const selected = activeContext?.type === 'incident' && entry.dataset.incidentId === activeContext.id;
        entry.setAttribute('aria-current', String(selected));
        entry.lastElementChild.replaceWith(indicator(sessionStates.get(entry.dataset.sessionId), selected));
      }
    }

    async function selectSession(id) {
      return selectContext({ type: 'conversation', id, sessionId: id });
    }

    async function loadActive(context, version) {
      const session = await api(`/api/sessions/${context.sessionId}`);
      if (version !== selectionVersion || activeContext?.sessionId !== context.sessionId) return;
      rememberState(context.sessionId, session);
      procedureProgress.hide();
      history.replaceChildren();
      for (const message of session.messages) renderStoredMessage(message);
      loadedRevision = session.revision;
      procedureAwaitingInput = session.awaiting_input;
      if (session.processing && session.progress) procedureProgress.show(session.progress);
      status.textContent = '';
      updateComposer();
      await api(`/api/sessions/${context.sessionId}/read`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({revision: session.revision}),
      });
    }

    async function selectContext(context) {
      const version = ++selectionVersion;
      activeContext = context;
      updateSelection();
      procedureProgress.hide();
      procedureAwaitingInput = false;
      history.replaceChildren();
      loadedRevision = null;
      input.value = '';
      exitProcedureMode();
      loadingContext = true;
      updateComposer();
      status.textContent = 'Loading conversation...';
      try {
        await loadActive(context, version);
        await refreshSessions();
        await refreshIncidents();
      } catch (error) {
        if (version === selectionVersion) status.textContent = 'Unable to load this conversation.';
      } finally {
        if (version === selectionVersion) {
          loadingContext = false;
          updateComposer();
          input.focus();
        }
      }
    }

    async function newSession() {
      try {
        const session = await api('/api/sessions', { method: 'POST' });
        await selectSession(session.session_id);
      } catch (error) { status.textContent = `Error: ${error.message}`; }
    }

    newButton.addEventListener('click', newSession);

    async function initialize() {
      try {
        const sessions = await refreshSessions();
        if (sessions.length) await selectSession(sessions[0].session_id);
        else await newSession();
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
      }
    }


    const incidentList = document.querySelector('#incidents');
    const incidentStatus = document.querySelector('#incident-status');
    function appendIncident(incident) {
      if (history.querySelector(`[data-incident-id="${incident.id}"]`)) return;
      const line = document.createElement('div');
      line.className = `message incident severity-${incident.severity}`;
      line.dataset.incidentId = incident.id;
      const label = document.createElement('div');
      label.className = 'incident-label';
      label.textContent = `INCIDENT · ${incident.severity.toUpperCase()}`;
      const title = document.createElement('div');
      title.className = 'incident-title';
      title.textContent = incident.title;
      const body = document.createElement('div');
      body.className = 'incident-body';
      body.textContent = incident.message;
      line.append(label, title, body);
      history.append(line);
    }
    async function openIncident(id) {
      const version = ++selectionVersion;
      try {
        const incident = await api(`/api/incidents/${encodeURIComponent(id)}`);
        if (version !== selectionVersion) return;
        await selectContext({ type: 'incident', id, sessionId: incident.session_id });
        incidentStatus.textContent = '';
      } catch (error) { incidentStatus.textContent = `Error: ${error.message}`; }

    }
    async function refreshIncidents() {
      try {
        const incidents = await api('/api/incidents');
        incidentList.replaceChildren();
        for (const incident of incidents) {
          const entry = document.createElement('button');
          entry.type = 'button';
          entry.className = `context-select incident-item severity-${incident.severity}`;
          entry.dataset.incidentId = incident.id;
          entry.dataset.sessionId = incident.session_id;
          const title = document.createElement('div');
          rememberState(incident.session_id, incident);
          title.className = 'sidebar-title';
          title.textContent = incident.title;
          entry.title = incident.title;
          const meta = document.createElement('div');
          meta.className = 'incident-meta';
          meta.textContent = `${incident.severity} · ${new Date(incident.created_at).toLocaleString()}`;
          const copy = document.createElement('span');
          copy.className = 'sidebar-copy';
          copy.append(title, meta);
          entry.append(copy, indicator(incident, activeContext?.sessionId === incident.session_id));
          entry.addEventListener('click', () => openIncident(incident.id));
          incidentList.append(sidebarRow(entry, {type: 'incident', id: incident.id, sessionId: incident.session_id}, incident.processing));
        }
        updateSelection();
        incidentStatus.textContent = incidents.length ? '' : 'No incidents yet.';
      } catch { incidentStatus.textContent = 'Unable to refresh incidents. Retrying…'; }

    }


    function renderMarkdown(text) {
      const html = marked.parse(text, { gfm: true, breaks: true });
      return DOMPurify.sanitize(html);
    }

    function appendMessage(text, role) {
      const line = document.createElement('div');
      line.className = `message ${role}`;
      if (role === 'assistant') {
        line.innerHTML = renderMarkdown(text);
      } else if (role === 'user') {
        line.textContent = `> ${text}`;
      } else {
        line.textContent = text;
      }
      history.append(line);
      form.scrollIntoView({ block: 'end' });
    }

    // A /procedure request is visibly distinct from a normal chat message:
    // a labeled, accent-bordered line instead of the plain "> text" bubble.
    function appendProcedureMessage(query) {
      const line = document.createElement('div');
      line.className = 'message procedure-user';
      const label = document.createElement('div');
      label.className = 'procedure-label';
      label.textContent = 'PROCEDURE';
      const body = document.createElement('div');
      body.textContent = query;
      line.append(label, body);
      history.append(line);
      form.scrollIntoView({ block: 'end' });
    }

    // Reconstruct a persisted session message exactly as it was originally
    // rendered live, with no extra wire-format metadata needed: a stored
    // user message that still matches the same `/procedure ...` pattern the
    // live submit handler checks restores as the styled "PROCEDURE" line;
    // everything else (including procedure KB/step/summary output, which
    // is persisted as plain assistant messages) is just a normal message.
    function renderStoredMessage(message) {
      if (message.type === 'incident') {
        if (message.incident) appendIncident(message.incident);
        return;
      }
      if (message.role === 'user' && activeContext?.type === 'conversation') {
        const match = message.content.match(PROCEDURE_PATTERN);
        if (match) {
          appendProcedureMessage((match[2] || '').trim());
          return;
        }
      }
      appendMessage(message.content, message.role);
    }

    // Reusable transient progress indicator. Procedure stages call show()/
    // update()/hide() with a short label (e.g. "Searching KB", later
    // "Parsing procedure", "Running step 1", ...). Only one instance is ever
    // visible; it never becomes part of chat history and disappears
    // completely — success or failure — once the current operation ends.
    const ELLIPSIS_FRAMES = ['.', '..', '...'];

    const procedureProgress = (() => {
      let element = null;
      let label = null;
      let timer = null;

      function show(text) {
        hide();
        element = document.createElement('div');
        element.className = 'procedure-progress';
        label = document.createElement('span');
        label.textContent = text;
        const ellipsis = document.createElement('span');
        ellipsis.className = 'procedure-progress-ellipsis';
        ellipsis.setAttribute('aria-hidden', 'true');
        element.append(label, ellipsis);
        history.append(element);
        form.scrollIntoView({ block: 'end' });
        let index = 0;
        ellipsis.textContent = ELLIPSIS_FRAMES[0];
        timer = setInterval(() => {
          index = (index + 1) % ELLIPSIS_FRAMES.length;
          ellipsis.textContent = ELLIPSIS_FRAMES[index];
        }, 400);
      }

      function update(text) {
        if (label) label.textContent = text;
        else show(text);
      }

      function hide() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
        if (element) {
          element.remove();
          element = null;
          label = null;
        }
      }

      return { show, update, hide };
    })();

    // One line of the backend's live procedure event stream (see
    // app.web._stream_procedure / app.procedure's module docstring):
    // each line is handled the instant it arrives, not batched up and
    // read only once the whole response finishes.
    function handleProcedureEvent(data) {
      if (data.type === 'procedure_progress') {
        procedureProgress.show(data.message);
      } else if (data.type === 'procedure_progress_clear') {
        procedureProgress.hide();
      } else if (data.type === 'procedure_message') {
        // A permanent message always ends any transient bubble still
        // showing, even if its matching clear event was somehow skipped.
        procedureProgress.hide();
        appendMessage(data.message, 'assistant');
      } else if (data.type === 'procedure_status') {
        procedureProgress.hide();
        procedureAwaitingInput = data.state === 'collecting_inputs';
      }
    }

    // Read the streaming NDJSON response body incrementally, dispatching
    // each complete line as soon as it is available -- this is what makes
    // progress genuinely live instead of a single batched response.
    async function readProcedureStream(response) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (value) buffer += decoder.decode(value, { stream: true });
        let newlineIndex;
        while ((newlineIndex = buffer.indexOf('\n')) !== -1) {
          const line = buffer.slice(0, newlineIndex);
          buffer = buffer.slice(newlineIndex + 1);
          if (line.trim()) handleProcedureEvent(JSON.parse(line));
        }
        if (done) break;
      }
      if (buffer.trim()) handleProcedureEvent(JSON.parse(buffer));
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = (procedureMode ? `/procedure ${input.value}` : input.value).trim();
      const owner = activeContext;
      if (!message || !owner || loadingContext || sessionStates.get(owner.sessionId)?.processing) return;
      const version = selectionVersion;
      rememberState(owner.sessionId, {processing: true});
      updateComposer();
      input.value = '';
      exitProcedureMode();
      try {
        await api(`/api/sessions/${owner.sessionId}/messages`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'Prefer': 'respond-async'},
          body: JSON.stringify({message}),
        });
        if (version === selectionVersion) await loadActive(owner, version);
        await refreshSessions();
        await refreshIncidents();
      } catch (error) {
        // Transport errors belong only to the view which submitted the message.
        if (version === selectionVersion) status.textContent = `Error: ${error.message}`;
      } finally {
        if (version === selectionVersion) updateComposer();
      }
    });

    async function pollContexts() {
      try {
        await Promise.all([refreshSessions(), refreshIncidents()]);
        const owner = activeContext;
        const version = selectionVersion;
        if (owner && !loadingContext) {
          const state = await api(`/api/sessions/${owner.sessionId}/state`);
          if (version === selectionVersion) {
            rememberState(owner.sessionId, state);
            if (loadedRevision !== state.revision) await loadActive(owner, version);
            else {
              procedureProgress.hide();
              if (state.processing && state.progress) procedureProgress.show(state.progress);
            }
            updateComposer();
          }
        }
      } catch { /* Retry without replacing another context's messages. */ }
      setTimeout(pollContexts, 1000);
    }
    initialize();
    pollContexts();
  </script>
</body>
</html>
